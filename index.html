<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>厨二病って1年７組にいるよね。</title>
    <!-- Google Fonts: ドットフォント (DotGothic16) -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F8F9FA;
            font-family: "DotGothic16", "MS PGothic", monospace;
            color: #000000 !important;
            text-align: justify;
            text-justify: inter-ideograph;
        }
        /* すべての文字を黒で均等に */
        * {
            color: #000000;
            letter-spacing: 0.05em;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.2s ease-out forwards;
        }
        /* スレッド一覧の虹色チカチカ文字 */
        @keyframes rainbowBlink {
            0% { color: #ff0000; }
            16% { color: #ff7f00; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            66% { color: #0000ff; }
            83% { color: #4b0082; }
            100% { color: #8b00ff; }
        }
        .rainbow-text {
            animation: rainbowBlink 0.8s infinite;
        }
        /* 長押し対応：レス本文の選択・コールアウトを無効化（コピーはｺﾋﾟｰボタンで） */
        .msg-item {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .msg-flash {
            background-color: #FEF9C3;
            transition: background-color 0.3s;
        }

        /* ==================== UIアニメーション（色・背景は変更なし） ==================== */
        @keyframes popIn { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
        @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes dropDown { from{opacity:0;transform:translateY(-8px) scaleY(.9)} to{opacity:1;transform:translateY(0) scaleY(1)} }
        @keyframes overlayIn { from{opacity:0} to{opacity:1} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

        button,input,textarea,select{transition:transform .15s,box-shadow .2s,background-color .2s,border-color .2s}
        button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.25)}
        button:active:not(:disabled){transform:scale(.95)}
        input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px rgba(0,0,0,.25);outline:none}

        #auth-view{animation:popIn .4s ease-out}
        #main-app-view:not(.hidden){animation:fadeIn .4s ease-out}
        #thread-list-view:not(.hidden),#thread-detail-view:not(.hidden),
        #subtab-chat-view:not(.hidden),#subtab-thread-view:not(.hidden),#subtab-setting-view:not(.hidden){animation:slideUp .3s ease-out}
        #drawer-menu:not(.hidden),#board-dropdown-menu:not(.hidden),.read-list:not(.hidden){animation:dropDown .2s ease-out;transform-origin:top}
        #reply-bar:not(.hidden){animation:slideUp .2s ease-out}
        #image-modal:not(.hidden),#action-menu:not(.hidden),#thread-pass-modal:not(.hidden){animation:overlayIn .2s ease-out}
        #action-menu-box,#thread-pass-modal>div,#modal-image-view{animation:popIn .25s ease-out}
        #threads-container>div{transition:transform .15s,box-shadow .2s}
        #threads-container>div:hover{transform:translateX(4px);box-shadow:0 2px 6px rgba(0,0,0,.2)}
        #drawer-menu button,#board-dropdown-menu div{transition:padding-left .15s,background-color .15s}
        #drawer-menu button:hover,#board-dropdown-menu div:hover{padding-left:1rem;transform:none;box-shadow:none}
        #hamburger-btn:hover{transform:scale(1.1)}
        #typing-indicator:not(:empty){animation:pulse 1.2s infinite}
        .chat-image-thumb,.reply-quote{transition:transform .2s}
        .chat-image-thumb:hover{transform:scale(1.04)}
        .reply-quote:hover{transform:translateX(3px)}
        @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
    </style>
</head>
<body class="p-2 md:p-4 flex items-center justify-center min-h-screen">

    <div class="max-w-4xl w-full mx-auto bg-white border-2 border-gray-500 p-4 shadow-md relative">
        
        <!-- ==================== ハンバーガーメニューボタン（右上） ==================== -->
        <button id="hamburger-btn" class="absolute top-4 right-4 z-40 bg-gray-200 border border-gray-500 p-2 text-black hover:bg-gray-300 cursor-pointer hidden">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- ==================== ハンバーガーメニュー・ドロワー/タブ ==================== -->
        <div id="drawer-menu" class="hidden absolute top-16 right-4 z-50 bg-white border-2 border-black w-48 shadow-lg p-2 text-sm">
            <div class="font-bold border-b border-black pb-1 mb-2 text-center" data-i18n="menu_title">メニュー</div>
            <button id="tab-back" class="w-full text-left px-3 py-1.5 hover:bg-gray-200 cursor-pointer font-bold border-b border-gray-200" data-i18n="menu_back">← 戻る</button>
            <button id="tab-chat" class="w-full text-left px-3 py-1.5 hover:bg-gray-200 cursor-pointer font-bold border-b border-gray-200" data-i18n="menu_chat">チャット</button>
            <button id="tab-thread" class="w-full text-left px-3 py-1.5 hover:bg-gray-200 cursor-pointer font-bold border-b border-gray-200" data-i18n="menu_thread">スレッド</button>
            <button id="tab-setting" class="w-full text-left px-3 py-1.5 hover:bg-gray-200 cursor-pointer font-bold" data-i18n="menu_setting">設定</button>
        </div>

        <!-- ==================== 認証画面（ログイン） ==================== -->
        <div id="auth-view" class="max-w-md mx-auto my-8 bg-white border border-gray-400 p-6 shadow-sm">
            <h1 class="text-lg font-bold text-black mb-4 text-center border-b-2 border-black pb-2">
                log in…
            </h1>

            <div class="space-y-4 text-sm">
                <p class="text-xs text-gray-800 mb-2" data-i18n="login_hint">IDとパスワードを入力しろかすぅー😅</p>
                <div>
                    <label class="block font-bold text-black mb-1">ID:</label>
                    <input type="text" id="login-id" placeholder="???" class="w-full border border-gray-400 px-3 py-2 bg-white text-black">
                </div>
                <div>
                    <label class="block font-bold text-black mb-1">passwd:</label>
                    <div class="relative">
                        <input type="password" id="login-pass" placeholder="???" class="w-full border border-gray-400 px-3 py-2 pr-10 bg-white text-black">
                        <button type="button" id="toggle-login-pass" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-600 hover:text-black cursor-pointer">
                            <svg id="login-pass-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <button id="do-login-btn" class="w-full bg-gray-200 border border-gray-500 py-2 text-sm font-bold text-black hover:bg-gray-300 active:bg-gray-400 cursor-pointer shadow-sm mt-2">
                    GOO
                </button>
            </div>
        </div>

        <!-- ==================== メイン掲示板画面 ==================== -->
        <div id="main-app-view" class="hidden">
            
            <!-- 上部バー -->
            <div class="mb-4 bg-gray-100 border border-gray-400 p-3 text-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-bold text-black" data-i18n="board_select">板選択：</span>
                    <!-- 自作の板選択UI（ドロップダウンではなく独自カスタムUI） -->
                    <div class="relative inline-block text-left" id="custom-board-dropdown">
                        <button type="button" id="board-dropdown-btn" class="border border-gray-400 px-3 py-1 bg-white font-bold text-black cursor-pointer text-xs flex items-center justify-between gap-2 min-w-[120px]">
                            <span id="board-dropdown-selected">...</span>
                            <span>▼</span>
                        </button>
                        <div id="board-dropdown-menu" class="hidden absolute left-0 mt-1 w-full bg-white border border-gray-400 shadow-lg z-30">
                            <!-- 動的生成 -->
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3 flex-wrap w-full md:w-auto justify-between md:justify-end">
                    <span id="user-info-display" class="text-xs font-bold text-black truncate max-w-[220px] md:max-w-none"></span>
                </div>
            </div>

            <!-- スレッド一覧画面 -->
            <div id="thread-list-view">
                <div class="flex justify-between items-center mb-4 border-b-2 border-black pb-2">
                    <h1 class="text-base md:text-lg font-bold text-black">
                        <span id="board-title-text" class="rainbow-text">スレッド一覧 スレッド一覧</span>
                    </h1>
                </div>

                <!-- 新規スレッド作成フォーム -->
                <div class="bg-gray-50 border border-gray-400 p-3.5 mb-6 text-sm space-y-3">
                    <div class="font-bold text-black border-b border-gray-300 pb-1" data-i18n="new_thread_head">■ 新規スレッド作成</div>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2">
                        <label class="w-32 font-bold text-black text-xs" data-i18n="thread_title_label">スレッドタイトル:</label>
                        <input type="text" id="new-thread-title" data-i18n-ph="ph_thread_title" placeholder="例：オ○ニーの仕方について語るスレッド" class="border border-gray-400 px-2 py-1 flex-1 w-full text-xs bg-white text-black">
                    </div>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2">
                        <label class="w-32 font-bold text-black text-xs" data-i18n="thread_pw_label">スレッドPW(任意):</label>
                        <div class="relative flex-1 w-full">
                            <input type="password" id="new-thread-pass" data-i18n-ph="ph_thread_pass" placeholder="パスワード（なしなら空欄）" class="border border-gray-400 px-2 py-1 w-full text-xs pr-10 bg-white text-black">
                            <button type="button" id="toggle-new-thread-pass" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-600 hover:text-black cursor-pointer">
                                <svg id="new-thread-pass-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row items-start gap-2">
                        <label class="w-32 font-bold text-black text-xs pt-1" data-i18n="first_body_label">最初の本文(1レス目):</label>
                        <textarea id="new-thread-message" rows="2" data-i18n-ph="ph_first_msg" placeholder="スレッドの最初のメッセージを入力..." class="border border-gray-400 px-2 py-1 flex-1 w-full text-xs resize-none bg-white text-black focus:outline-none"></textarea>
                    </div>
                    <div class="flex justify-end pt-1">
                        <button id="create-thread-btn" class="bg-gray-200 border border-gray-500 px-5 py-1.5 text-xs font-bold text-black hover:bg-gray-300 active:bg-gray-400 cursor-pointer shadow-sm" data-i18n="create_thread_btn">
                            スレッドを立てる
                        </button>
                    </div>
                </div>

                <!-- スレッド一覧リスト -->
                <div class="font-bold text-black mb-2 text-xs" data-i18n="thread_list_label">【スレッド一覧（レス数順）】</div>
                <div id="threads-container" class="space-y-2 min-h-[200px] border border-gray-300 p-3 bg-white"></div>
            </div>

            <!-- スレッド詳細・チャット画面 -->
            <div id="thread-detail-view" class="hidden">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b-2 border-black pb-2 gap-2">
                    <h1 id="active-thread-title" class="text-base md:text-lg font-bold text-black"></h1>
                    <button id="back-to-list-btn" class="bg-gray-200 border border-gray-500 px-3 py-1 text-xs font-bold text-black hover:bg-gray-300 cursor-pointer shadow-sm" data-i18n="back_to_list">
                        &laquo; スレッド一覧に戻る
                    </button>
                </div>

                <!-- レス一覧表示エリア -->
                <div id="chat-container" class="space-y-3 mb-2 min-h-[300px] max-h-[450px] overflow-y-auto border border-gray-300 p-3 bg-white text-xs"></div>
                
                <!-- 入力中表示エリア -->
                <div id="typing-indicator" class="text-xs text-gray-600 h-5 mb-2 font-bold px-1"></div>

                <!-- 投稿フォーム -->
                <div class="bg-gray-50 border border-gray-400 p-3 text-sm space-y-2">
                    <!-- リプライ先表示バー -->
                    <div id="reply-bar" class="hidden">
                        <div class="flex items-center justify-between gap-2 bg-gray-100 border-l-4 border-gray-500 px-2 py-1 text-xs">
                            <div class="min-w-0 flex-1">
                                <div id="reply-bar-name" class="font-bold truncate"></div>
                                <div id="reply-bar-text" class="truncate"></div>
                            </div>
                            <button type="button" id="reply-bar-close" class="px-2 font-bold text-base cursor-pointer">&times;</button>
                        </div>
                    </div>
                    <div class="flex items-start gap-2">
                        <label class="w-14 font-bold text-black text-xs pt-1" data-i18n="body_label">本文:</label>
                        <textarea id="message-input" rows="3" data-i18n-ph="ph_message" placeholder="ここにメッセージを入力..." class="border border-gray-400 px-2 py-1 flex-1 text-xs resize-none bg-white text-black focus:outline-none"></textarea>
                    </div>
                    <div class="flex justify-between items-center flex-wrap gap-2">
                        <span id="posting-as" class="text-xs text-black font-bold truncate max-w-[250px]"></span>
                        
                        <!-- 送信ボタン ＆ 各種メディアアイコン -->
                        <div class="flex items-center gap-2">
                            <button id="send-btn" class="bg-gray-200 border border-gray-500 px-5 py-1.5 text-xs font-bold text-black hover:bg-gray-300 active:bg-gray-400 cursor-pointer shadow-sm" data-i18n="post_btn">
                                書き込む
                            </button>

                            <!-- 非表示の写真ファイル選択用input (3個まで一括選択可能) -->
                            <input type="file" id="image-file-input" accept="image/*" multiple class="hidden">
                            
                            <!-- 画像シルエットボタン -->
                            <button type="button" id="image-upload-btn" title="写真を最大3個まで送信" class="bg-gray-200 border border-gray-500 p-1.5 text-black hover:bg-gray-300 active:bg-gray-400 cursor-pointer shadow-sm flex items-center justify-center">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==================== サブタブ：チャット履歴ビュー ==================== -->
            <div id="subtab-chat-view" class="hidden">
                <div class="border-b-2 border-black pb-2 mb-4">
                    <h2 class="text-base font-bold text-black" data-i18n="subtab_chat_head">■ 送信履歴（いままで何回目に何を送信したか）</h2>
                </div>
                <div id="my-chat-history-container" class="space-y-2 border border-gray-300 p-3 bg-white text-xs min-h-[300px]"></div>
            </div>

            <!-- ==================== サブタブ：スレッド履歴ビュー ==================== -->
            <div id="subtab-thread-view" class="hidden">
                <div class="border-b-2 border-black pb-2 mb-4">
                    <h2 class="text-base font-bold text-black" data-i18n="subtab_thread_head">■ 自分が建てたスレッド一覧</h2>
                </div>
                <div id="my-threads-history-container" class="space-y-2 border border-gray-300 p-3 bg-white text-xs min-h-[300px]"></div>
            </div>

            <!-- ==================== サブタブ：設定ビュー ==================== -->
            <div id="subtab-setting-view" class="hidden">
                <div class="border-b-2 border-black pb-2 mb-4">
                    <h2 class="text-base font-bold text-black" data-i18n="setting_head">■ 設定</h2>
                </div>
                <div class="bg-white border border-gray-300 p-4 text-xs space-y-4">
                    <!-- 言語設定（ログアウトの上） -->
                    <div>
                        <p class="font-bold mb-2" data-i18n="set_lang">言語設定</p>
                        <select id="lang-select" class="border border-gray-400 px-3 py-1.5 bg-white font-bold text-black cursor-pointer">
                            <option value="ja">日本語</option>
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                            <option value="ar">العربية</option>
                            <option value="es">Español</option>
                            <option value="ko">한국어</option>
                        </select>
                    </div>
                    <div>
                        <p class="font-bold mb-2" data-i18n="set_logout_label">ログアウト処理など</p>
                        <button id="sub-logout-btn" class="bg-gray-200 border border-gray-500 px-4 py-1.5 font-bold text-black hover:bg-gray-300 cursor-pointer" data-i18n="logout_btn">
                            ログアウト
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- ==================== 画像全画面モーダル（ズームなし・右上に×のみ） ==================== -->
    <div id="image-modal" class="fixed inset-0 bg-black hidden flex items-center justify-center z-50" style="touch-action:none;">
        <button id="close-image-modal" type="button" class="absolute top-3 right-3 z-20 cursor-pointer font-bold leading-none"
            style="background:none;border:none;padding:4px 12px;font-size:40px;color:#fff !important;text-shadow:0 0 4px #000;">&times;</button>
        <img id="modal-image-view" src="" class="max-w-full max-h-full" style="width:100vw;height:100vh;object-fit:contain;">
    </div>

    <!-- ==================== 長押しアクションメニュー ==================== -->
    <div id="action-menu" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
        <div id="action-menu-box" class="bg-white border-2 border-black w-64 shadow-lg text-sm"></div>
    </div>

    <!-- ==================== スレッドパスワード入力モーダル ==================== -->
    <div id="thread-pass-modal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white border-2 border-black max-w-sm w-full p-4 shadow-lg text-sm relative">
            <div class="flex justify-between items-center border-b-2 border-black pb-2 mb-3">
                <button id="close-pass-modal-btn" class="bg-gray-200 border border-gray-400 px-2 py-0.5 text-xs font-bold text-black hover:bg-gray-300 cursor-pointer" data-i18n="pass_back">
                    &laquo; 戻る
                </button>
                <h2 class="text-sm font-bold text-black" data-i18n="pass_title">パスワード認証</h2>
                <div class="w-10"></div>
            </div>
            <p class="text-xs text-black mb-3" data-i18n="pass_desc">このスレッドにはパスワードが設定されています💀。</p>
            <div class="mb-3">
                <label class="block font-bold text-black mb-1 text-xs">passwd:</label>
                <div class="relative">
                    <input type="password" id="enter-thread-pass" data-i18n-ph="ph_enter_pass" placeholder="パスワードを入力" class="w-full border border-gray-400 px-3 py-1.5 text-xs pr-10 bg-white text-black">
                    <button type="button" id="toggle-thread-pass" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-600 hover:text-black cursor-pointer">
                        <svg id="thread-pass-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <button id="submit-thread-pass-btn" class="w-full bg-gray-200 border border-gray-500 py-1.5 text-xs font-bold text-black hover:bg-gray-300 cursor-pointer shadow-sm" data-i18n="pass_enter">
                スレッドに入る
            </button>
        </div>

            navHistory.push(entry);
            if (navHistory.length > 50) navHistory.shift();
        }

            drawerMenu.classList.add('hidden');
            if (!currentUser || navHistory.length <= 1) return;
            navHistory.pop();
            const prev = navHistory[navHistory.length - 1];
            navSuppress = true;
            try {

                    case 'list':

                        showThreadListView();
                        break;
                    case 'thread':
                        currentBoardId = prev.boardId || currentBoardId;

        function formatDate(timestamp) {
            if (!timestamp) return "";
            const dateObj = new Date(timestamp);
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            const h = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');

            return `${y}/${m}/${d}(${dayOfWeek}) ${h}:${min}`;

        // ==================== 長押し検出 ====================
        function attachLongPress(el, handler) {
            let timer = null;
            let sx = 0, sy = 0;
            const getPoint = (e) => (e.touches && e.touches[0]) ? e.touches[0] : e;
            const start = (e) => {
                const p = getPoint(e);
                sx = p.clientX; sy = p.clientY;
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => {
                    timer = null;
                    longPressFired = true;
                    setTimeout(() => { longPressFired = false; }, 500);
                    handler();
                }, 500);
            };
            const cancel = () => {
                if (timer) { clearTimeout(timer); timer = null; }
            };
            const move = (e) => {
                if (!timer) return;
                const p = getPoint(e);
                if (Math.abs(p.clientX - sx) > 10 || Math.abs(p.clientY - sy) > 10) cancel();
            };
            el.addEventListener('touchstart', start, { passive: true });
            el.addEventListener('touchmove', move, { passive: true });
            el.addEventListener('touchend', cancel);
            el.addEventListener('touchcancel', cancel);
            el.addEventListener('mousedown', start);
            el.addEventListener('mousemove', move);
            el.addEventListener('mouseup', cancel);
            el.addEventListener('mouseleave', cancel);
            el.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        // ==================== コピー ====================
        async function copyText(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (_) {}
                document.body.removeChild(ta);
            }
            btn.textContent = t('copied');
            setTimeout(() => { btn.textContent = t('copy'); }, 1200);
        }

        // ==================== 既読マーク ====================
        function markRead(messages) {
            if (!messages || !currentUser || !messagesRef || document.hidden) return;
            const pending = {};
            Object.keys(messages).forEach(msgId => {
                const d = messages[msgId];
                if (!d || d.deleted) return;
                if (!d.userId || d.userId === 'SYSTEM' || d.userId === currentUser.id) return;
                if (d.readBy && d.readBy[currentUser.id]) return;
                pending[`${msgId}/readBy/${currentUser.id}`] = currentUser.name;
            });
            if (Object.keys(pending).length > 0) {
                update(messagesRef, pending).catch(() => {});
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && lastMessages) markRead(lastMessages);
        });

        // ==================== レス描画 ====================
        function renderMessages(messages) {
            const nearBottom = (chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight) < 80;
            const prevScrollTop = chatContainer.scrollTop;

            chatContainer.innerHTML = '';
            if (!messages) {
                chatContainer.innerHTML = `<div class="text-black text-xs">${escapeHtml(t('no_messages'))}</div>`;
                return;
            }

            let resCount = 0;

            Object.keys(messages).forEach(msgId => {
                resCount++;
                const data = messages[msgId];
                if (!data) return;

                const isDeleted = !!data.deleted;
                const isSystem = data.userId === 'SYSTEM';

                const msgDiv = document.createElement('div');
                msgDiv.id = `msg-${msgId}`;
                msgDiv.className = "msg-item animate-fade border-b border-gray-200 pb-2.5 mb-2.5 relative text-xs";

                const timeStr = formatDate(data.createdAt);
                const name = escapeHtml(data.username || "💀名無しさん🥛");
                const userIdDisp = data.userId ? ` ID:${escapeHtml(formatDisplayId(data.userId, data.customTitle))}` : '';

                // リプライ引用
                let replyHtml = "";
                if (data.replyTo && data.replyTo.id) {
                    const target = messages[data.replyTo.id];
                    let quoteText;
                    if (target && target.deleted) {
                        quoteText = t('unsent_short');
                    } else if (data.replyTo.text) {
                        quoteText = data.replyTo.text;
                    } else if (data.replyTo.image) {
                        quoteText = t('image_label');
                    } else {
                        quoteText = '';
                    }
                    replyHtml = `
                        <div class="reply-quote border-l-4 border-gray-400 bg-gray-100 px-2 py-1 mb-1 cursor-pointer" data-target="${escapeHtml(data.replyTo.id)}">
                            <div class="font-bold truncate">↩ ${escapeHtml(data.replyTo.username || '')}</div>
                            <div class="truncate">${escapeHtml(quoteText)}</div>
                        </div>`;
                }

                let contentHtml = "";
                if (isDeleted) {
                    contentHtml = `<div class="text-gray-500 italic">${escapeHtml(t('unsent_msg'))}</div>`;
                } else {
                    if (data.images && Array.isArray(data.images)) {
                        contentHtml += `<div class="mt-1 flex flex-wrap gap-2">`;
                        data.images.forEach(imgUrl => {
                            contentHtml += `<img src="${imgUrl}" class="max-w-xs max-h-48 border border-gray-300 shadow-sm cursor-pointer chat-image-thumb" />`;
                        });
                        contentHtml += `</div>`;
                    } else if (data.image) {
                        contentHtml = `<div class="mt-1"><img src="${data.image}" class="max-w-xs max-h-48 border border-gray-300 shadow-sm cursor-pointer chat-image-thumb" /></div>`;
                    }
                    if (data.text) {
                        const text = escapeHtml(data.text).replace(/\n/g, '<br>');
                        contentHtml += `<div class="text-black whitespace-pre-wrap leading-relaxed ${(data.images || data.image) ? 'mt-1' : ''}">${text}</div>`;
                    }
                }

                // 既読（投稿者本人は除外）→ 名前 + ID を表示
                const readers = (!isDeleted && data.readBy)
                    ? Object.keys(data.readBy).filter(uid => uid !== data.userId).map(uid => `${data.readBy[uid] || ''} (ID:${uid})`)
                    : [];
                const readCount = readers.length;
                const readOpen = openReadLists.has(msgId);

                let footerHtml = "";
                if (!isDeleted && !isSystem) {
                    footerHtml = `<div class="mt-1 flex items-center gap-2 flex-wrap">`;
                    if (data.text) {
                        footerHtml += `<button type="button" class="copy-btn bg-gray-100 border border-gray-400 px-2 py-0.5 text-xs font-bold cursor-pointer hover:bg-gray-200">${escapeHtml(t('copy'))}</button>`;
                    }
                    footerHtml += `<button type="button" class="read-btn bg-gray-100 border border-gray-400 px-2 py-0.5 text-xs font-bold cursor-pointer hover:bg-gray-200">${escapeHtml(t('read'))} ${readCount}</button>`;
                    footerHtml += `</div>`;
                    footerHtml += `<div class="read-list ${readOpen ? '' : 'hidden'} mt-1 border border-gray-400 bg-white p-1.5 text-xs">${readCount > 0 ? readers.map(n => `<div>・${escapeHtml(n)}</div>`).join('') : '<div class="text-gray-500">-</div>'}</div>`;
                }

                msgDiv.innerHTML = `
                    <div class="mb-1 flex items-center justify-between flex-wrap gap-1">
                        <div class="flex items-center gap-1 flex-wrap">
                            <span class="font-bold">${resCount}</span> ：
                            <span class="font-bold text-black">${name}</span> ：
                            <span class="text-gray-600">${timeStr}</span>
                            <span class="text-gray-700 font-mono">${userIdDisp}</span>
                        </div>
                    </div>
                    <div class="pl-4">${replyHtml}${contentHtml}${footerHtml}</div>
                `;

                // 画像タップで全画面表示（長押し直後は無視）
                msgDiv.querySelectorAll('.chat-image-thumb').forEach(thumbImg => {
                    thumbImg.addEventListener('click', () => {
                        if (longPressFired) return;
                        modalImageView.src = thumbImg.src;
                        imageModal.classList.remove('hidden');
                    });
                });

                // リプライ引用タップで元のレスへ移動
                const quoteEl = msgDiv.querySelector('.reply-quote');
                if (quoteEl) {
                    quoteEl.addEventListener('click', () => {
                        if (longPressFired) return;
                        const target = document.getElementById(`msg-${quoteEl.getAttribute('data-target')}`);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            target.classList.add('msg-flash');
                            setTimeout(() => target.classList.remove('msg-flash'), 1300);
                        }
                    });
                }

                // ｺﾋﾟｰ
                const copyBtn = msgDiv.querySelector('.copy-btn');
                if (copyBtn) {
                    copyBtn.addEventListener('click', () => copyText(data.text, copyBtn));
                }

                // 既読ドロップダウン
                const readBtn = msgDiv.querySelector('.read-btn');
                const readList = msgDiv.querySelector('.read-list');
                if (readBtn && readList) {
                    readBtn.addEventListener('click', () => {
                        if (readList.classList.contains('hidden')) {
                            readList.classList.remove('hidden');
                            openReadLists.add(msgId);
                        } else {
                            readList.classList.add('hidden');
                            openReadLists.delete(msgId);
                        }
                    });
                }

                // 長押し（自分＝送信取り消し / 他人＝リプライ）
                if (!isDeleted && !isSystem) {
                    attachLongPress(msgDiv, () => showActionMenu(msgId, data));
                }

                chatContainer.appendChild(msgDiv);
            });

            if (forceScrollBottom || nearBottom) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
                forceScrollBottom = false;
            } else {
                chatContainer.scrollTop = prevScrollTop;
            }
        }

        function setupThreadListeners(threadId) {
            if (messagesRef) off(messagesRef);
            if (typingRef) off(typingRef);

            forceScrollBottom = true;
            messagesRef = ref(db, `boards/${currentBoardId}/threads/${threadId}/messages`);
            
            onValue(messagesRef, (snapshot) => {
                lastMessages = snapshot.exists() ? snapshot.val() : null;
                renderMessages(lastMessages);
                markRead(lastMessages);
            });

            typingRef = ref(db, `boards/${currentBoardId}/threads/${threadId}/typing`);
            onValue(typingRef, (snapshot) => {
                const typingData = snapshot.val();
                if (!typingData) {
                    typingIndicator.textContent = '';
                    return;
                }
                const now = Date.now();
                const activeTypers = [];
                Object.keys(typingData).forEach(uid => {
                    if (currentUser && uid === currentUser.id) return;
                    const info = typingData[uid];
                    if (info && (now - info.timestamp < 4000)) {
                        activeTypers.push(info.name);
                    }
                });

                if (activeTypers.length > 0) {
                    typingIndicator.textContent = `${activeTypers.join(', ')}${t('typing_suffix')}`;
                } else {
                    typingIndicator.textContent = '';
                }
            });
        }

        async function loadThreads(boardId) {
            let boardName = t('thread_list_title');
            const metaSnap = await get(ref(db, `board_meta/${boardId}`));
            if (metaSnap.exists()) {
                boardName = metaSnap.val().name || boardId;
            }
            boardTitleText.textContent = `■ ${boardName} ${t('thread_list_title')} ${t('thread_list_title')} ■`;

            try {
                const snapshot = await get(ref(db, `boards/${boardId}/threads`));
                threadsContainer.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    threadsContainer.innerHTML = `<div class="text-black text-xs">${escapeHtml(t('no_threads'))}</div>`;
                    return;
                }

                let threadArray = Object.keys(data).map(tId => ({ id: tId, boardId: boardId, ...data[tId] }));

                threadArray.sort((a, b) => {
                    const countA = a.messages ? Object.keys(a.messages).length : 0;
                    const countB = b.messages ? Object.keys(b.messages).length : 0;
                    return countB - countA;
                });

                renderThreadList(threadArray);
            } catch (e) {
                console.error(e);
            }
        }

        function renderThreadList(threadArray) {
            threadsContainer.innerHTML = '';
            threadArray.forEach((thread) => {
                const threadId = thread.id;
                const targetBoardId = thread.boardId || currentBoardId;
                const title = thread.title || t('untitled');
                const threadPassword = thread.password || "";
                const messagesCount = thread.messages ? Object.keys(thread.messages).length : 0;
                const creator = escapeHtml(thread.creator || "🥛名無しさん🍌");
                const dateStr = formatDate(thread.createdAt);
                const lockIcon = (threadPassword !== "") ? `<span class="text-black font-bold mr-1">🔒${escapeHtml(t('pw_tag'))}</span>` : '';

                const threadDiv = document.createElement('div');
                threadDiv.className = "animate-fade bg-white border border-gray-300 p-2 text-xs flex flex-col md:flex-row justify-between items-start md:items-center hover:bg-gray-50 cursor-pointer shadow-sm gap-2";
                threadDiv.innerHTML = `
                    <div class="flex-1 w-full truncate">
                        ${lockIcon}<span class="font-bold text-black">${escapeHtml(title)}</span>
                    </div>
                    <div class="flex items-center gap-3 text-gray-700 whitespace-nowrap flex-wrap">
                        <span>${escapeHtml(t('creator'))}: <strong class="text-black">${creator}</strong></span>
                        <span class="hidden sm:inline">${dateStr}</span>
                        <span class="bg-gray-100 border border-gray-300 px-2 py-0.5 text-black font-bold">${escapeHtml(t('res'))}: ${messagesCount}</span>
                    </div>
                `;

                threadDiv.addEventListener('click', () => {
                    currentBoardId = targetBoardId;
                    openThread(threadId, title, threadPassword);
                });

                threadsContainer.appendChild(threadDiv);
            });
        }

        async function checkSpamAndExecute() {
            const now = Date.now();
            
            if (isSending) {
                alert("送信中...");
                throw new Error("STILL_SENDING");
            }

            if (lastSendTime && (now - lastSendTime < 3000)) {
                rapidSendCount++;
            } else {
                rapidSendCount = 1;
            }
            lastSendTime = now;

            if (rapidSendCount >= 20) {
                rapidSendCount = 0; 
                currentUser.violationCount = (currentUser.violationCount || 0) + 1;

                const isBanned = currentUser.violationCount >= 10;
                const timeoutUntilTime = now + 60000;

                await update(ref(db, `id_registry/${currentUser.id}`), {
                    violationCount: currentUser.violationCount,
                    banned: isBanned,
                    timeoutUntil: timeoutUntilTime
                });

                currentUser.timeoutUntil = timeoutUntilTime;

                if (currentThreadId) {
                    const spamMsgRef = ref(db, `boards/${currentBoardId}/threads/${currentThreadId}/messages`);
                    await push(spamMsgRef, {
                        username: "【運営システム】",
                        text: `${currentUser.name}のアカウントは1分間タイムアウトされました 理由:スパム💀🤣`,
                        userId: "SYSTEM",
                        createdAt: Date.now()
                    });
                }

                if (isBanned) {
                    alert(`【アカウント停止】\n制限を超えたため、アカウントが停止されました。😅🤣`);
                    logoutApp();
                    throw new Error("ACCOUNT_BANNED");
                } else {
                    alert(`【スパム検知】\n連続送信が検知されたため、1分間タイムアウトされました。😅🤣`);
                    throw new Error("ACCOUNT_TIMEOUT");
                }
            }

            if (currentUser.timeoutUntil && now < currentUser.timeoutUntil) {
                const remainSec = Math.ceil((currentUser.timeoutUntil - now) / 1000);
                alert(`タイムアウト中です。あと ${remainSec} 秒お待ちください。🤣🤣`);
                throw new Error("STILL_TIMEOUT");
            }
        }

        createThreadBtn.addEventListener('click', async () => {
            try {
                const selectedBoard = currentBoardId;
                if (!selectedBoard) {
                    alert("板が選択されていません。🤣");
                    return;
                }

                const now = Date.now();
                if (lastThreadCreateTime && (now - lastThreadCreateTime < 60000)) {
                    const remainSec = Math.ceil((60000 - (now - lastThreadCreateTime)) / 1000);
                    alert(`スレッドを作成してから1分間は新しいスレッドを作成できません。あと ${remainSec} 秒お待ちください。💀🥛`);
                    return;
                }

                const title = newThreadTitleInput.value.trim();
                const threadPass = newThreadPassInput.value.trim();
                const message = newThreadMessageInput.value.trim();

                if (!title) {
                    alert("スレッドタイトルを入力してください。🔪🥄🍴");
                    return;
                }
                if (!message) {
                    alert("最初の本文を入力してください。🍯");
                    return;
                }

                await checkSpamAndExecute();

                lastThreadCreateTime = Date.now();

                const userName = (currentUser && currentUser.name) ? currentUser.name : "名無しさん☕️☕️";
                const userId = (currentUser && currentUser.id) ? currentUser.id : "unknown";
                const nowTime = Date.now();

                const newThreadRef = push(ref(db, `boards/${selectedBoard}/threads`));
                const threadId = newThreadRef.key;

                await set(ref(db, `boards/${selectedBoard}/threads/${threadId}`), {
                    title: title,
                    password: threadPass,
                    creator: userName,
                    creatorId: userId,
                    createdAt: nowTime,
                    boardId: selectedBoard,
                    messages: {
                        [push(ref(db, `boards/${selectedBoard}/threads/${threadId}/messages`)).key]: {
                            username: userName,
                            text: message,
                            userId: userId,
                            customTitle: currentUser.customTitle || '',
                            createdAt: nowTime
                        }
                    }
                });

                newThreadTitleInput.value = '';
                newThreadPassInput.value = '';
                newThreadMessageInput.value = '';
                proceedOpenThread(threadId, title);

            } catch (e) {
                if (e.message !== "ACCOUNT_TIMEOUT" && e.message !== "STILL_TIMEOUT" && e.message !== "ACCOUNT_BANNED" && e.message !== "STILL_SENDING") {
                    alert("【スレッド作成エラー🤣💀】\n" + e.message);
                }
            }
        });

        async function sendMessage(payloadImages = null, textPayload = null) {
            try {
                const message = textPayload !== null ? textPayload : messageInput.value.trim();
                if ((!message && (!payloadImages || payloadImages.length === 0)) || !currentThreadId) return;

                await checkSpamAndExecute();

                isSending = true;
                sendBtn.textContent = t('sending');
                sendBtn.disabled = true;

                await remove(ref(db, `boards/${currentBoardId}/threads/${currentThreadId}/typing/${currentUser.id}`)).catch(()=>{});

                const userName = (currentUser && currentUser.name) ? currentUser.name : "名無しさん";
                const userId = (currentUser && currentUser.id) ? currentUser.id : "unknown";

                const msgData = {
                    username: userName,
                    userId: userId,
                    customTitle: currentUser.customTitle || '',
                    createdAt: Date.now()
                };

                if (message) msgData.text = message;
                if (payloadImages && payloadImages.length > 0) {
                    msgData.images = payloadImages;
                }
                if (replyingTo) {
                    msgData.replyTo = {
                        id: replyingTo.id,
                        username: replyingTo.username,
                        text: replyingTo.text,
                        image: replyingTo.image
                    };
                }

                const msgRef = ref(db, `boards/${currentBoardId}/threads/${currentThreadId}/messages`);
                await push(msgRef, msgData);

                clearReply();
                forceScrollBottom = true;
                
                if (textPayload === null) {
                    messageInput.value = "";
                    messageInput.focus();
                }

                setTimeout(() => {
                    isSending = false;
                    sendBtn.textContent = t('post_btn');
                    sendBtn.disabled = false;
                }, 1000);

            } catch (e) {
                isSending = false;
                sendBtn.textContent = t('post_btn');
                sendBtn.disabled = false;

                if (e.message !== "ACCOUNT_TIMEOUT" && e.message !== "STILL_TIMEOUT" && e.message !== "ACCOUNT_BANNED" && e.message !== "STILL_SENDING") {
                    alert("【🤣書き込みエラー🤣】\n" + e.message);
                }
            }
        }

        sendBtn.addEventListener('click', () => sendMessage());

        // 写真シルエットボタン（最大3個まで同時選択・送信）
        imageUploadBtn.addEventListener('click', () => {
            if (!currentThreadId) {
                alert("スレッドに入ってください。");
                return;
            }
            imageFileInput.click();
        });

        imageFileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            if (files.length > 3) {
                alert("一度に選択できる写真は最大3個までです！😅");
                imageFileInput.value = '';
                return;
            }

            for (let file of files) {
                // 1GB (1024MB) 制限チェック
                if (file.size > 1024 * 1024 * 1024) {
                    alert(`ファイルサイズが大きすぎます（1GB以下にしてください）: ${file.name} 😅`);
                    imageFileInput.value = '';
                    return;
                }
            }

            const base64Images = [];
            for (let file of files) {
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => resolve(ev.target.result);
                    reader.readAsDataURL(file);
                });
                base64Images.push(base64);
            }

            const optionalCaption = messageInput.value.trim();
            await sendMessage(base64Images, optionalCaption);
            messageInput.value = "";
            imageFileInput.value = '';
        });

        // ==================== サブタブ画面の実装 ====================
        async function showSubtabChatHistory() {
            recordNav({ type: 'chat' });
            clearAllIntervals();
            hideAllMainViews();
            subtabChatView.classList.remove('hidden');
            myChatHistoryContainer.innerHTML = `<div class="text-black">${escapeHtml(t('loading'))}</div>`;

            try {
                const boardsSnap = await get(ref(db, 'boards'));
                if (!boardsSnap.exists()) {
                    myChatHistoryContainer.innerHTML = `<div class="text-black">${escapeHtml(t('no_history'))}</div>`;
                    return;
                }

                const boardsData = boardsSnap.val();
                let myMessages = [];

                Object.keys(boardsData).forEach(bId => {
                    const threads = boardsData[bId].threads;
                    if (!threads) return;
                    Object.keys(threads).forEach(tId => {
                        const thread = threads[tId];
                        const messages = thread.messages;
                        if (!messages) return;
                        
                        let seq = 0;
                        Object.keys(messages).forEach(mId => {
                            seq++;
                            const msg = messages[mId];
                            if (msg && msg.userId === currentUser.id) {
                                myMessages.push({
                                    boardName: bId,
                                    threadTitle: thread.title || '無題',
                                    sequenceNumber: seq,
                                    ...msg
                                });
                            }
                        });
                    });
                });

                myMessages.sort((a, b) => b.createdAt - a.createdAt);

                myChatHistoryContainer.innerHTML = '';
                if (myMessages.length === 0) {
                    myChatHistoryContainer.innerHTML = `<div class="text-black">${escapeHtml(t('no_history'))}</div>`;
                    return;
                }

                myMessages.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = "border-b border-gray-200 pb-2 mb-2 text-xs";
                    const dateStr = formatDate(item.createdAt);
                    
                    let contentDesc = "";
                    if (item.deleted) {
                        contentDesc = escapeHtml(t('unsent_msg'));
                    } else {
                        if (item.text) contentDesc += escapeHtml(item.text);
                        if (item.images) contentDesc += ` [画像 ${item.images.length}枚付き]`;
                        if (item.image) contentDesc += ` [画像付き]`;
                    }

                    div.innerHTML = `
                        <div class="font-bold text-black mb-1">■ 履歴 #${myMessages.length - idx} （通算 ${item.sequenceNumber} 回目の送信）</div>
                        <div class="text-gray-700">スレッド: ${escapeHtml(item.threadTitle)} | 日時: ${dateStr}</div>
                        <div class="text-black mt-1 p-1 bg-gray-50 border border-gray-200">送信内容: ${contentDesc}</div>
                    `;
                    myChatHistoryContainer.appendChild(div);
                });

            } catch (e) {
                myChatHistoryContainer.innerHTML = `<div class="text-black">エラー: ${e.message}</div>`;
            }
        }

        async function showSubtabThreadHistory() {
            recordNav({ type: 'threadHist' });
            clearAllIntervals();
            hideAllMainViews();
            subtabThreadView.classList.remove('hidden');
            myThreadsHistoryContainer.innerHTML = `<div class="text-black">${escapeHtml(t('loading'))}</div>`;

            try {
                const boardsSnap = await get(ref(db, 'boards'));
                if (!boardsSnap.exists()) {
                    myThreadsHistoryContainer.innerHTML = `<div class="text-black">${escapeHtml(t('no_my_threads'))}</div>`;
                    return;
                }

                const boardsData = boardsSnap.val();
                let myThreads = [];

                Object.keys(boardsData).forEach(bId => {
                    const threads = boardsData[bId].threads;
                    if (!threads) return;
                    Object.keys(threads).forEach(tId => {
                        const thread = threads[tId];
                        if (thread && thread.creatorId === currentUser.id) {
                            myThreads.push({
                                threadId: tId,
                                boardId: bId,
                                ...thread
                            });
                        }
                    });
                });

                myThreads.sort((a, b) => b.createdAt - a.createdAt);

                myThreadsHistoryContainer.innerHTML = '';
                if (myThreads.length === 0) {
                    myThreadsHistoryContainer.innerHTML = `<div class="text-black">${escapeHtml(t('no_my_threads'))}</div>`;
                    return;
                }

                myThreads.forEach((thread) => {
                    const div = document.createElement('div');
                    div.className = "border-b border-gray-200 pb-2 mb-2 text-xs flex justify-between items-center bg-white p-2 border border-gray-200 hover:bg-gray-50 cursor-pointer shadow-sm";
                    const dateStr = formatDate(thread.createdAt);
                    const msgCount = thread.messages ? Object.keys(thread.messages).length : 0;

                    div.innerHTML = `
                        <div>
                            <div class="font-bold text-black text-sm">${escapeHtml(thread.title)}</div>
                            <div class="text-gray-600">作成日時: ${dateStr} | ${escapeHtml(t('res'))}: ${msgCount}</div>
                        </div>
                        <button class="bg-gray-200 border border-gray-400 px-2 py-1 font-bold text-black text-xs">${escapeHtml(t('open'))}</button>
                    `;

                    div.addEventListener('click', () => {
                        currentBoardId = thread.boardId || 'zatudan';
                        openThread(thread.threadId, thread.title, thread.password);
                    });

                    myThreadsHistoryContainer.appendChild(div);
                });

            } catch (e) {
                myThreadsHistoryContainer.innerHTML = `<div class="text-black">エラー: ${e.message}</div>`;
            }
        }

        function showSubtabSetting() {
            recordNav({ type: 'setting' });
            clearAllIntervals();
            hideAllMainViews();
            subtabSettingView.classList.remove('hidden');
        }

        backToListBtn.addEventListener('click', showThreadListView);

        // 初期言語を反映
        applyLanguage();
    </script>
